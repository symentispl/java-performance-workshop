name: Auto Cherry-Pick PR

on:
  push:
    branches: [ master, parallel, batching, workstealing, virtualthreads ]
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to cherry-pick from'
        required: true
        default: 'master'
      target_branch:
        description: 'Target branch to cherry-pick to'
        required: true
        default: 'parallel'

env:
  # Define the branch propagation chain
  BRANCH_CHAIN: |
    master=parallel
    parallel=batching
    batching=workstealing
    workstealing=virtualthreads
    virtualthreads=server

jobs:
  create-cherry-pick-pr:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/server'  # Don't trigger on server branch pushes
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for cherry-picking
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Fetch all branches
      run: |
        git fetch --all
        git branch -r | grep -v '\->' | while read remote; do
          branch=${remote#origin/}
          if [ "$branch" != "HEAD" ] && [ "$branch" != "cherry-pick-668adc86856b82ee56ab195fba9b8186f2238f3b" ]; then
            git branch --track "$branch" "$remote" 2>/dev/null || true
          fi
        done
        echo "Available branches:"
        git branch -a

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Determine source and target branches
      id: branches
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          SOURCE_BRANCH="${{ github.event.inputs.source_branch }}"
          TARGET_BRANCH="${{ github.event.inputs.target_branch }}"
        else
          # Get the branch that was pushed to
          SOURCE_BRANCH=$(echo ${{ github.ref }} | sed 's/refs\/heads\///')
          
          # Find the target branch from the chain
          TARGET_BRANCH=$(echo "$BRANCH_CHAIN" | grep "^${SOURCE_BRANCH}=" | cut -d'=' -f2)
        fi
        
        if [ -z "$TARGET_BRANCH" ]; then
          echo "No target branch defined for $SOURCE_BRANCH"
          exit 0
        fi
        
        echo "source_branch=$SOURCE_BRANCH" >> $GITHUB_OUTPUT
        echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT
        
        echo "Source branch: $SOURCE_BRANCH"
        echo "Target branch: $TARGET_BRANCH"

    - name: Check for new commits to cherry-pick
      id: commits
      if: steps.branches.outputs.target_branch != ''
      run: |
        SOURCE_BRANCH="${{ steps.branches.outputs.source_branch }}"
        TARGET_BRANCH="${{ steps.branches.outputs.target_branch }}"
        
        # Ensure we're referencing the correct remote branches
        if [ "$SOURCE_BRANCH" = "master" ]; then
          SOURCE_REF="origin/master"
        else
          SOURCE_REF="origin/$SOURCE_BRANCH"
        fi
        
        if [ "$TARGET_BRANCH" = "master" ]; then
          TARGET_REF="origin/master" 
        else
          TARGET_REF="origin/$TARGET_BRANCH"
        fi
        
        echo "Checking for commits between $SOURCE_REF and $TARGET_REF"
        
        # Find commits that are in source but not in target
        COMMITS_TO_PICK=$(git log --reverse --pretty=format:"%H" "$SOURCE_REF" --not "$TARGET_REF")
        
        if [ -z "$COMMITS_TO_PICK" ]; then
          echo "No new commits to cherry-pick from $SOURCE_BRANCH to $TARGET_BRANCH"
          echo "has_commits=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        echo "has_commits=true" >> $GITHUB_OUTPUT
        echo "commits<<EOF" >> $GITHUB_OUTPUT
        echo "$COMMITS_TO_PICK" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        # Count commits
        COMMIT_COUNT=$(echo "$COMMITS_TO_PICK" | wc -l)
        echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
        
        echo "Found $COMMIT_COUNT commits to cherry-pick"

    - name: Create cherry-pick branch
      id: cherry_pick
      if: steps.commits.outputs.has_commits == 'true'
      run: |
        SOURCE_BRANCH="${{ steps.branches.outputs.source_branch }}"
        TARGET_BRANCH="${{ steps.branches.outputs.target_branch }}"
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        CHERRY_PICK_BRANCH="cherry-pick/${SOURCE_BRANCH}-to-${TARGET_BRANCH}-${TIMESTAMP}"
        
        echo "cherry_pick_branch=$CHERRY_PICK_BRANCH" >> $GITHUB_OUTPUT
        
        # Checkout target branch and create new branch
        git checkout "$TARGET_BRANCH"
        git checkout -b "$CHERRY_PICK_BRANCH"
        
        # Cherry-pick commits
        COMMITS="${{ steps.commits.outputs.commits }}"
        SUCCESS_COUNT=0
        CONFLICT_COUNT=0
        COMMIT_MESSAGES=""
        
        for commit in $COMMITS; do
          COMMIT_MSG=$(git log --format="%s" -n 1 "$commit")
          COMMIT_HASH_SHORT=$(git log --format="%h" -n 1 "$commit")
          
          echo "Cherry-picking $COMMIT_HASH_SHORT: $COMMIT_MSG"
          
          if git cherry-pick "$commit"; then
            SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            COMMIT_MESSAGES="$COMMIT_MESSAGES\n- ✅ $COMMIT_HASH_SHORT: $COMMIT_MSG"
            echo "✓ Successfully cherry-picked $commit"
          else
            CONFLICT_COUNT=$((CONFLICT_COUNT + 1))
            COMMIT_MESSAGES="$COMMIT_MESSAGES\n- ⚠️ $COMMIT_HASH_SHORT: $COMMIT_MSG (CONFLICT)"
            echo "✗ Conflict in $commit, committing conflict markers for manual resolution"
            
            # Add conflicted files and commit with conflict markers
            git add -A
            git commit -m "Cherry-pick $COMMIT_HASH_SHORT: $COMMIT_MSG (CONFLICTS - manual resolution needed)"
          fi
        done
        
        echo "success_count=$SUCCESS_COUNT" >> $GITHUB_OUTPUT
        echo "conflict_count=$CONFLICT_COUNT" >> $GITHUB_OUTPUT
        echo "commit_messages<<EOF" >> $GITHUB_OUTPUT
        echo -e "$COMMIT_MESSAGES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        # Push the cherry-pick branch
        git push origin "$CHERRY_PICK_BRANCH"
        
        echo "Created and pushed cherry-pick branch: $CHERRY_PICK_BRANCH"

    - name: Create Pull Request
      if: steps.commits.outputs.has_commits == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const sourceBranch = '${{ steps.branches.outputs.source_branch }}';
          const targetBranch = '${{ steps.branches.outputs.target_branch }}';
          const cherryPickBranch = '${{ steps.cherry_pick.outputs.cherry_pick_branch }}';
          const commitCount = '${{ steps.commits.outputs.commit_count }}';
          const successCount = '${{ steps.cherry_pick.outputs.success_count }}';
          const conflictCount = '${{ steps.cherry_pick.outputs.conflict_count }}';
          const commitMessages = `${{ steps.cherry_pick.outputs.commit_messages }}`;
          
          const title = `Cherry-pick: ${sourceBranch} → ${targetBranch} (${commitCount} commits)`;
          
          let body = `## 🍒 Auto Cherry-Pick from ${sourceBranch} to ${targetBranch}
          
          This PR was automatically created to propagate commits through the branch chain:
          \`master → parallel → batching → workstealing → virtualthreads → server\`
          
          ### Summary
          - **Total commits:** ${commitCount}
          - **Successfully applied:** ${successCount}
          - **Conflicts requiring resolution:** ${conflictCount}
          
          ### Commits included:
          ${commitMessages}
          `;
          
          if (conflictCount > 0) {
            body += `
          
          ### ⚠️ Manual Action Required
          This PR contains **${conflictCount} commit(s) with conflicts** that need manual resolution:
          
          1. Check out this branch: \`git checkout ${cherryPickBranch}\`
          2. Resolve conflicts in the affected files
          3. Add resolved files: \`git add <files>\`
          4. Commit the resolution: \`git commit\`
          5. Push changes: \`git push origin ${cherryPickBranch}\`
          
          **Note:** Commits with conflicts have been committed with conflict markers for easy identification.`;
          } else {
            body += `
          
          ### ✅ Ready to Merge
          All commits were successfully cherry-picked without conflicts. This PR is ready for review and merge.`;
          }
          
          body += `
          
          ---
          *This PR was automatically created by the Auto Cherry-Pick workflow.*`;
          
          const labels = conflictCount > 0 ? ['auto-cherry-pick', 'conflicts'] : ['auto-cherry-pick', 'ready-to-merge'];
          
          try {
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              head: cherryPickBranch,
              base: targetBranch,
              body: body
            });
            
            // Add labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.data.number,
              labels: labels
            });
            
            console.log(`Created PR #${pr.data.number}: ${title}`);
            console.log(`PR URL: ${pr.data.html_url}`);
            
            // Set output for summary
            core.setOutput('pr_number', pr.data.number);
            core.setOutput('pr_url', pr.data.html_url);
            
          } catch (error) {
            console.error('Error creating PR:', error.message);
            core.setFailed(`Failed to create PR: ${error.message}`);
          }

    - name: Create workflow summary
      if: steps.commits.outputs.has_commits == 'true'
      run: |
        SOURCE_BRANCH="${{ steps.branches.outputs.source_branch }}"
        TARGET_BRANCH="${{ steps.branches.outputs.target_branch }}"
        PR_URL="${{ steps.create_pr.outputs.pr_url }}"
        COMMIT_COUNT="${{ steps.commits.outputs.commit_count }}"
        SUCCESS_COUNT="${{ steps.cherry_pick.outputs.success_count }}"
        CONFLICT_COUNT="${{ steps.cherry_pick.outputs.conflict_count }}"
        
        echo "## 🍒 Auto Cherry-Pick Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Source:** \`$SOURCE_BRANCH\` → **Target:** \`$TARGET_BRANCH\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Total commits:** $COMMIT_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "- **Successfully applied:** $SUCCESS_COUNT ✅" >> $GITHUB_STEP_SUMMARY
        echo "- **Conflicts:** $CONFLICT_COUNT ⚠️" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "$PR_URL" != "" ]; then
          echo "**[📋 View Pull Request]($PR_URL)**" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Branch Chain" >> $GITHUB_STEP_SUMMARY
        echo "\`master → parallel → batching → workstealing → virtualthreads → server\`" >> $GITHUB_STEP_SUMMARY
