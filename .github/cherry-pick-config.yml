# Cherry-pick branch chain configuration
# Format: source_branch -> target_branch
chain:
  master: parallel
  parallel: batching
  batching: workstealing
  workstealing: virtualthreads
  virtualthreads: server

# Settings
settings:
  # Labels to add to PRs
  labels:
    success: ["auto-cherry-pick", "ready-to-merge"]
    conflicts: ["auto-cherry-pick", "conflicts", "manual-resolution-needed"]
  
  # PR template settings
  auto_merge: false  # Don't auto-merge even if no conflicts
  delete_branch_after_merge: true  # Clean up cherry-pick branches after merge
